name: Daily aggregation and Pages
on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC = next day 07:00 JST; scheduling may be delayed.
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: daily-pages
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m lab.aggregate
      - run: python -m lab.issues --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
